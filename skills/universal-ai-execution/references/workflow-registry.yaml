      - Violating model dependencies
      - Making seeds non-repeatable

  - id: marketplace-design
    name: Marketplace Design
    category: Business
    when_to_use: Use when designing or evaluating a marketplace model, including supply, demand, trust, and liquidity.
    workflow_sequence:
      - Steelman
      - Supply/Demand Audit
      - Assumption Audit
      - Devil’s Advocate
      - Liquidity Risk Review
      - Trust/Safety Review
      - MVP Scope Cut
      - Validation Plan
    focus_areas:
      - Supply and demand balance
      - Liquidity risk
      - Trust and safety
    required_outputs:
      - Marketplace model assessment
      - MVP scope
      - Validation plan
    validation_rules:
      - Identify which side of the market is harder.
      - Address trust, safety, and quality controls.
      - Define liquidity validation before scaling.
    common_mistakes:
      - Assuming both sides will arrive together
      - Ignoring trust and safety mechanics
      - Scaling before proving liquidity

  - id: pricing-monetization
    name: Pricing Monetization
    category: Business
    when_to_use: Use when designing pricing, packaging, monetization strategy, or willingness-to-pay validation.
    workflow_sequence:
      - Steelman
      - Customer Segment Map
      - Value Metric Audit
      - Willingness-To-Pay Test
      - Devil’s Advocate
      - Competitor Benchmark
      - Pricing Model
      - Validation Plan
    focus_areas:
      - Customer segments
      - Value metric
      - Pricing validation
    required_outputs:
      - Segment and value metric analysis
      - Pricing model
      - Validation plan
    validation_rules:
      - Tie price to customer value and segment.
      - Include willingness-to-pay evidence or test plan.
      - Benchmark competitors without copying blindly.
    common_mistakes:
      - Pricing by cost alone
      - Ignoring packaging complexity
      - Treating competitor prices as proof

  - id: gtm-strategy
    name: GTM Strategy
    category: Business
    when_to_use: Use when developing go-to-market strategy, customer targeting, channels, messaging, or launch motion.
    workflow_sequence:
