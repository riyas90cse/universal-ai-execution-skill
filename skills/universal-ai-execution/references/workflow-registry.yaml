      - Channels and distribution
      - Messaging validation
    required_outputs:
      - ICP and pain summary
      - Distribution plan
      - Messaging and validation plan
    validation_rules:
      - Define a specific ICP.
      - Connect channels to customer behavior.
      - Include validation loops for messaging.
    common_mistakes:
