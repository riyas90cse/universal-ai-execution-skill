    focus_areas:
      - Market and urgency
      - Differentiation
      - Investor objections
    required_outputs:
      - Pitch critique
      - Investor objection list
      - Rewrite plan
    validation_rules:
      - Make the problem urgency explicit.
      - Explain why the company can win.
      - Address likely investor objections.
    common_mistakes:
